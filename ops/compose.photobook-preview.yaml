# Run on NAS from this ops directory: docker compose -f compose.photobook-preview.yaml up -d
services:
  preview:
    image: python:3.12-slim-bookworm
    container_name: mizuki-photobook-preview
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    ports:
      - "192.168.1.99:8101:8080"
    volumes:
      - ../dist:/site:ro
      - ../scripts/photobook/preview-server.py:/preview-server.py:ro
    command: ["python", "/preview-server.py", "--bind", "0.0.0.0", "--port", "8080", "--directory", "/site"]
